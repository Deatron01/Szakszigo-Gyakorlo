<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Szakszigo-Gyakorlo — Every classic programming theorem, implemented in C#.">
  <title>Szakszigo-Gyakorlo — Every classic programming theorem, implemented in C#.</title>
  <defs>
    <radialGradient id="glow" cx="86%" cy="50%" r="55%">
      <stop offset="0" stop-color="#7d3de8" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#7d3de8" stop-opacity=".06"/>
      <stop offset="1" stop-color="#7d3de8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .title { font: italic 700 80px Georgia, 'Times New Roman', 'Noto Serif', serif; fill: #f3ede2; }
    .tagline { font: 400 21px 'Courier New', Courier, 'Liberation Mono', monospace; fill: #f3ede2; opacity: .82; letter-spacing: 1px; }
    .tag { font: 400 17px 'Courier New', Courier, 'Liberation Mono', monospace; fill: #9a6ae8; letter-spacing: 4px; }
    .swash { fill: none; stroke: #7d3de8; stroke-width: 5.333333333333333; stroke-linecap: round;
